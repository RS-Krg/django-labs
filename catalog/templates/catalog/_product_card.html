{% load static %}<div class="card h-100 product-card"><a href="{{ product.get_absolute_url }}"><img class="card-img-top" src="{% if product.image %}{{ product.image.url }}{% else %}{% static 'img/no-image.svg' %}{% endif %}" alt="{{ product.name }}"></a><div class="card-body d-flex flex-column"><h2 class="h6"><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h2><p class="text-muted small">{{ product.category.name }}</p><p class="price mt-auto">{{ product.price|floatformat:"-2g" }} ₽</p>{% if product.in_stock %}<span class="text-success">В наличии: {{ product.stock }}</span>{% else %}<span class="text-danger">Нет в наличии</span>{% endif %}</div></div>
