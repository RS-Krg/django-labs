<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Заявки ИТ-отдела{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-primary mb-4"><div class="container">
    <a class="navbar-brand" href="{% url 'ticket_list' %}">ИТ-отдел</a>
    {% if user.is_authenticated %}
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="{% url 'ticket_list' %}">Заявки</a>
        <a class="nav-link" href="{% url 'ticket_create' %}">Новая заявка</a>
      </div>
      <span class="navbar-text text-white me-3">{{ user.get_full_name|default:user.username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm" type="submit">Выйти</button></form>
    {% endif %}
  </div></nav>
  <main class="container">
    {% for message in messages %}<div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
