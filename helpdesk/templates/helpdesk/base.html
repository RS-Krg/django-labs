{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Заявки ИТ-отдела{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="site-header">
    <nav class="container" aria-label="Главная навигация">
      <a class="navbar-brand" href="{% url 'ticket_list' %}">ИТ-отдел</a>
      {% if user.is_authenticated %}
      <div class="site-nav">
        <a class="nav-link" href="{% url 'ticket_list' %}">Заявки</a>
        <a class="nav-link" href="{% url 'ticket_create' %}">Новая заявка</a>
      </div>
      <div class="site-actions">
        <span class="text-muted small">{{ user.get_full_name|default:user.username }}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-secondary btn-sm" type="submit">Выйти</button></form>
      </div>
      {% endif %}
    </nav>
  </header>
  <main class="container page-main">
    {% for message in messages %}<div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="status">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
