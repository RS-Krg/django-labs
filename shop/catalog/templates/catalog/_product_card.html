{% load static %}
<article class="card h-100 product-card">
  <a href="{{ product.get_absolute_url }}" aria-label="Открыть {{ product.name }}">
    <img src="{% if product.image %}{{ product.image.url }}{% else %}{% static 'img/no-image.svg' %}{% endif %}" alt="{{ product.name }}" loading="lazy">
  </a>
  <div class="card-body d-flex flex-column">
    <p class="text-muted small mb-2">{{ product.category.name }}</p>
    <h2 class="h6"><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h2>
    <p class="price mt-auto">{{ product.price|floatformat:"-2g" }} ₽</p>
    {% if product.in_stock %}<span class="text-success small">В наличии: {{ product.stock }}</span>{% else %}<span class="text-danger small">Нет в наличии</span>{% endif %}
  </div>
</article>
