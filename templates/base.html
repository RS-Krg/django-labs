{% load static %}
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Магазин техники{% endblock %}</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="{% static 'css/shop.css' %}"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"><div class="container"><a class="navbar-brand" href="{% url 'catalog:product_list' %}">Магазин техники</a><div class="navbar-nav me-auto"><a class="nav-link" href="{% url 'catalog:product_list' %}">Все товары</a>{% for item in categories %}<a class="nav-link" href="{{ item.get_absolute_url }}">{{ item.name }}</a>{% endfor %}</div><form class="d-flex" action="{% url 'catalog:product_list' %}" method="get"><input class="form-control me-2" type="search" name="q" value="{{ query|default:'' }}" placeholder="Поиск"><button class="btn btn-outline-light" type="submit">Найти</button></form></div></nav>
<main class="container">{% for message in messages %}<div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
